<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<title>Login</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>

/* =========================
FUNDO PREMIUM (mais leve que Nubank)
========================= */
body{
    margin:0;
    font-family:'Poppins',sans-serif;
    height:100vh;
    overflow:hidden;

    background: radial-gradient(circle at top, #1e1b4b, #0f172a 60%);
}

/* leve brilho animado */
body::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background: radial-gradient(circle at 20% 20%, rgba(124,58,237,0.25), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(99,102,241,0.18), transparent 45%);
    animation: floatGlow 8s ease-in-out infinite alternate;
    pointer-events:none;
}

@keyframes floatGlow{
    from{ transform:scale(1); opacity:0.7; }
    to{ transform:scale(1.1); opacity:1; }
}

/* =========================
CONTAINER
========================= */
.login-container{
    display:flex;
    width:100%;
    height:100vh;
    position:relative;
}

/* =========================
ESQUERDA (mais clean)
========================= */
.login-left{
    width:50%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:80px;
    color:white;
    z-index:2;
}

.login-left h1{
    font-size:54px;
    line-height:1.1;
    margin-bottom:18px;
    font-weight:700;
}

.login-left p{
    font-size:16px;
    color:#cbd5e1;
    max-width:480px;
    line-height:1.7;
}

/* =========================
DIREITA
========================= */
.login-right{
    width:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
}

/* =========================
CARD PREMIUM (menos “vidro exagerado”)
========================= */
.login-box{
    width:100%;
    max-width:420px;

    padding:40px;

    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(18px);

    border: 1px solid rgba(255,255,255,0.10);

    border-radius: 26px;

    box-shadow: 0 30px 80px rgba(0,0,0,0.45);

    text-align:center;
}

/* LOGO (sem quadrado feio — só destaque suave) */
.login-logo{
    display:flex;
    justify-content:center;
    margin-bottom:18px;
}

.login-logo img{
    width:110px;
    filter: drop-shadow(0 18px 30px rgba(0,0,0,0.45));
}

/* TEXTOS */
.login-box h2{
    color:white;
    font-size:28px;
    margin-bottom:6px;
}

.login-box span{
    color:#cbd5e1;
    font-size:14px;
    display:block;
    margin-bottom:18px;
}

/* INPUTS */
.form-group{
    margin-top:16px;
    text-align:left;
}

.form-group label{
    color:#e2e8f0;
    font-size:13px;
    margin-bottom:6px;
    display:block;
}

.form-group input{
    width:100%;
    padding:15px;
    border-radius:14px;

    border:1px solid rgba(255,255,255,0.12);

    background: rgba(15,23,42,0.55);
    color:white;
    outline:none;

    transition:0.2s;
}

.form-group input:focus{
    border-color:#7c3aed;
    box-shadow:0 0 0 3px rgba(124,58,237,0.2);
}

/* BOTÃO */
.btn-login{
    width:100%;
    margin-top:22px;
    padding:15px;

    border:none;
    border-radius:14px;

    background: linear-gradient(135deg,#7c3aed,#6366f1);

    color:white;
    font-size:15px;
    font-weight:600;

    cursor:pointer;
    transition:0.2s;
}

.btn-login:hover{
    transform: translateY(-2px);
}

/* ERRO */
.erro{
    margin-top:14px;
    background:rgba(220,38,38,0.15);
    color:#fecaca;
    padding:12px;
    border-radius:12px;
    font-size:13px;
}

/* =========================
LOADING
========================= */
#loading-overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;

    background:rgba(0,0,0,0.45);
    backdrop-filter: blur(12px);

    display:none;
    align-items:center;
    justify-content:center;

    z-index:9999;
}

.loader-card{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:18px;
    padding:22px 30px;
    text-align:center;
    color:white;
}

.spinner{
    width:38px;
    height:38px;
    border:3px solid rgba(255,255,255,0.2);
    border-top:3px solid #7c3aed;
    border-radius:50%;
    margin:0 auto 10px auto;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{ transform:rotate(360deg); }
}

/* RESPONSIVO */
@media(max-width:1000px){
    .login-left{ display:none; }
    .login-right{ width:100%; }
}

</style>

</head>

<body>

<div class="login-container">

    <!-- ESQUERDA -->
    <div class="login-left">

        <h1>K+</h1>

        <h2>
           Seu centro de operações.
        </h2>

    </div>

    <!-- DIREITA -->
    <div class="login-right">

        <div class="login-box">

            <div class="login-logo">
                <img src="{{ url_for('static', filename='logo.png') }}">
            </div>

            <h2>Entrar</h2>
            <span>Acesse sua conta</span>

            <form method="POST">

                <div class="form-group">
                    <label>Usuário</label>
                    <input type="text" name="usuario" required>
                </div>

                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" name="senha" required>
                </div>

                <button class="btn-login" type="submit">
                    Entrar
                </button>

            </form>

            {% if erro %}
            <div class="erro">{{ erro }}</div>
            {% endif %}

        </div>

    </div>

</div>

<!-- LOADING -->
<div id="loading-overlay">
    <div class="loader-card">
        <div class="spinner"></div>
        <p>Entrando no sistema...</p>
    </div>
</div>

<script>
    
document.querySelector("form").addEventListener("submit", function(){

    document.getElementById("loading-overlay").style.display = "flex";

    const btn = document.querySelector(".btn-login");
    btn.innerText = "Entrando...";
    btn.disabled = true;

    document.body.style.transition = "0.4s";
    document.body.style.opacity = "0.3";
    document.body.style.filter = "blur(6px)";
});
</script>

</body>
</html>
</div>
