<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<title>Senha alterada</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    background:radial-gradient(circle at top,#1e1b4b,#0f172a 60%);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

body::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 20% 20%, rgba(124,58,237,.25), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(99,102,241,.18), transparent 45%);
    animation:floatGlow 8s ease-in-out infinite alternate;
    pointer-events:none;
}

@keyframes floatGlow{
    from{ transform:scale(1); opacity:.7; }
    to{ transform:scale(1.1); opacity:1; }
}

.sucesso-card{
    width:100%;
    max-width:420px;
    padding:42px;
    border-radius:26px;
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:0 30px 80px rgba(0,0,0,.45);
    text-align:center;
    color:white;
    position:relative;
    z-index:2;
}

.sucesso-icon{
    width:74px;
    height:74px;
    margin:0 auto 22px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(34,197,94,.16);
    color:#86efac;
}

.sucesso-icon i{
    width:38px;
    height:38px;
}

.sucesso-card h1{
    font-size:28px;
    margin:0 0 10px;
}

.sucesso-card p{
    color:#cbd5e1;
    font-size:14px;
    line-height:1.7;
    margin-bottom:26px;
}

.btn-voltar-login{
    width:100%;
    height:50px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#7c3aed,#6366f1);
    color:white;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:.2s;
}

.btn-voltar-login:hover{
    transform:translateY(-2px);
}
</style>
</head>

<body>

<div class="sucesso-card">

    <div class="sucesso-icon">
        <i data-lucide="check"></i>
    </div>

    <h1>Senha alterada!</h1>

    <p>
        Sua senha foi atualizada com sucesso.
        Agora você já pode acessar o sistema usando seu CPF e a nova senha.
    </p>

    <a href="/" class="btn-voltar-login">
        <i data-lucide="log-in"></i>
        Voltar ao login
    </a>

</div>

<script>
lucide.createIcons();
</script>

</body>
</html>
