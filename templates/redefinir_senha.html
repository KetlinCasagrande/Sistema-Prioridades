<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<title>Redefinir senha</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>

body{
    margin:0;
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;

    background:radial-gradient(circle at top,#1e1b4b,#0f172a 60%);
}

body::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 20% 20%, rgba(124,58,237,.25), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(99,102,241,.18), transparent 45%);
    animation:floatGlow 8s ease-in-out infinite alternate;
}

@keyframes floatGlow{
    from{
        transform:scale(1);
        opacity:.7;
    }

    to{
        transform:scale(1.08);
        opacity:1;
    }
}

.card{

    width:100%;
    max-width:430px;

    padding:42px;

    border-radius:26px;

    background:rgba(255,255,255,.06);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.10);

    box-shadow:0 30px 80px rgba(0,0,0,.45);

    position:relative;

    z-index:2;
}

.logo{

    text-align:center;

    margin-bottom:18px;
}

.logo img{

    width:120px;
}

h1{

    text-align:center;

    color:white;

    margin:0;

    font-size:28px;
}

.sub{

    text-align:center;

    color:#cbd5e1;

    margin-top:8px;

    margin-bottom:28px;

    line-height:1.6;

    font-size:14px;
}

.form-group{

    margin-bottom:18px;
}

.form-group label{

    display:block;

    color:white;

    margin-bottom:7px;

    font-size:13px;
}

.input-wrap{

    position:relative;
}

.input-wrap input{

    width:100%;

    padding:15px 48px 15px 15px;

    border-radius:14px;

    border:1px solid rgba(255,255,255,.12);

    background:rgba(15,23,42,.55);

    color:white;

    outline:none;

    box-sizing:border-box;
}

.btn-eye{

    position:absolute;

    right:14px;

    top:50%;

    transform:translateY(-50%);

    border:none;

    background:none;

    color:#cbd5e1;

    cursor:pointer;

    display:flex;
}

.btn-eye i{

    width:20px;
    height:20px;
}

.btn{

    width:100%;

    height:52px;

    margin-top:10px;

    border:none;

    border-radius:14px;

    background:linear-gradient(135deg,#7c3aed,#6366f1);

    color:white;

    font-size:15px;

    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

.btn:hover{

    transform:translateY(-2px);
}

.erro{

    margin-bottom:18px;

    padding:12px;

    border-radius:12px;

    background:rgba(220,38,38,.18);

    color:#fecaca;

    font-size:13px;
}

.regras{

    margin-top:20px;

    font-size:12px;

    color:#94a3b8;

    line-height:1.8;
}

</style>

</head>

<body>

<div class="card">

    <div class="logo">

        <img src="{{ url_for('static', filename='logo.png') }}">

    </div>

    <h1>Nova senha</h1>

    <p class="sub">

        Escolha uma senha segura para continuar utilizando o sistema.

    </p>

    {% if erro %}
        <div class="erro">
            {{ erro }}
        </div>
    {% endif %}

    <form method="POST">

        <div class="form-group">

            <label>Nova senha</label>

            <div class="input-wrap">

                <input
                    id="senha"
                    type="password"
                    name="senha"
                    required>

                <button
                    type="button"
                    class="btn-eye"
                    onclick="toggle('senha','icone1')">

                    <i
                        id="icone1"
                        data-lucide="eye">
                    </i>

                </button>

            </div>

        </div>

        <div class="form-group">

            <label>Confirmar senha</label>

            <div class="input-wrap">

                <input
                    id="confirmar"
                    type="password"
                    name="confirmar"
                    required>

                <button
                    type="button"
                    class="btn-eye"
                    onclick="toggle('confirmar','icone2')">

                    <i
                        id="icone2"
                        data-lucide="eye">
                    </i>

                </button>

            </div>

        </div>

        <button class="btn">

            Alterar senha

        </button>

    </form>

    <div class="regras">

        • Utilize pelo menos 6 caracteres.<br>
        • Evite utilizar informações pessoais.<br>
        • Nunca compartilhe sua senha.

    </div>

</div>

<script>

function toggle(id,icone){

    const campo=document.getElementById(id);

    const eye=document.getElementById(icone);

    if(campo.type==="password"){

        campo.type="text";

        eye.setAttribute("data-lucide","eye-off");

    }else{

        campo.type="password";

        eye.setAttribute("data-lucide","eye");

    }

    lucide.createIcons();
}

lucide.createIcons();

</script>

</body>

</html>
