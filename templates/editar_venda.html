<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Editar Venda</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="conteudo">

    <div class="card-meta">

        <h2>✏️ Editar Venda</h2>

        <form method="POST">

            <p>
                <strong>Produto:</strong>
                {{ venda["produto"] }}
            </p>

            <br>

            <input
                type="number"
                step="0.01"
                name="valor"
                value="{{ venda['valor'] }}"
                required>

            <br><br>

            <button
                type="submit"
                class="btn">

                💾 Salvar Alteração

            </button>

            <a
                href="/vendas"
                class="btn">

                ↩️ Voltar

            </a>

        </form>

    </div>

</div>

</body>
</html>
